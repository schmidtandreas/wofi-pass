# wofi-pass configuration file

# This file is sourced by wofi-pass and can override the
# default values for global variables from wofi-pass.
# All variables that can be changed are listed below.
# The listed variables are commented out, because
# the value is set to default and thus does not need to be changed.
#
# If you change other variables that are used by wofi-pass,
# you do so at your own risk.

## COMMON

# path to pass storage files
#PASSWORD_STORE_DIR="${HOME}/.password-store"

# initial entry search (unique entry matches bypass menus when --autotype is set)
#WOFI_PASS_PRESELECT=""

# default autotype format
# fixed alias: default (menu: autotype default, option: --autotype=default)
#WOFI_PASS_AUTOTYPE=":username :tab :password"

# additional autotype formats selected with -a1 through -a9 or --autotype=1 through =9
#WOFI_PASS_AUTOTYPE_1=":username :tab :password"
#WOFI_PASS_AUTOTYPE_2=":username :tab :password"
#WOFI_PASS_AUTOTYPE_3=":username :tab :password"
#WOFI_PASS_AUTOTYPE_4=":username :tab :password"
#WOFI_PASS_AUTOTYPE_5=":username :tab :password"
#WOFI_PASS_AUTOTYPE_6=":username :tab :password"
#WOFI_PASS_AUTOTYPE_7=":username :tab :password"
#WOFI_PASS_AUTOTYPE_8=":username :tab :password"
#WOFI_PASS_AUTOTYPE_9=":username :tab :password"

# optional aliases for menu labels and --autotype=alias (unique, nonnumeric, no whitespace)
# the alias "default" is reserved for WOFI_PASS_AUTOTYPE
#WOFI_PASS_AUTOTYPE_1_ALIAS=""
#WOFI_PASS_AUTOTYPE_2_ALIAS=""
#WOFI_PASS_AUTOTYPE_3_ALIAS=""
#WOFI_PASS_AUTOTYPE_4_ALIAS=""
#WOFI_PASS_AUTOTYPE_5_ALIAS=""
#WOFI_PASS_AUTOTYPE_6_ALIAS=""
#WOFI_PASS_AUTOTYPE_7_ALIAS=""
#WOFI_PASS_AUTOTYPE_8_ALIAS=""
#WOFI_PASS_AUTOTYPE_9_ALIAS=""

# autotype delay time in seconds
#WOFI_PASS_DELAY=2

# automatic enter after autotype output
#WOFI_PASS_AUTO_ENTER="false"

## COMMANDS

# command for put the output to clipboard
#CMD_COPY="wl-copy"

# command for type out the output
#CMD_TYPE="wtype -"

## PASS FIELDS

# field for username used for autotype functionality
#PASS_FIELD_USERNAME="username"

## HOTKEYS

# Select the username field directly
#HOTKEY_USERNAME=Alt-u

# Select the password field directly
#HOTKEY_PASSWORD=Alt-p

# Select the autotype field directly
#HOTKEY_AUTOTYPE=Alt-a

# Select the OTP field directly
#HOTKEY_OTP=Alt-o
